- query: 'Build a minimal todo list CLI from scratch in the current directory. Requirements:

    1. todo.py — Todo dataclass (id: int, title: str, done: bool default False).

    2. storage.py — load_todos(path) and save_todos(path, todos) using JSON.

    3. cli.py — argparse subcommands: add TITLE, list, done ID, clear. Uses todos.json.

    4. test_todo.py — pytest tests for Todo creation, save/load round-trip.

    5. Run the tests with run_tests (pytest) and confirm they pass.

    6. Run ''python cli.py add buy-milk'' and ''python cli.py list'' via run_bash.
    If stderr shows a SyntaxError or Traceback, fix and retry before declaring done.'
